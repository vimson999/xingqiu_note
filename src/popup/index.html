<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>知识星球助手 - Dashboard</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="header">
    <h3>星球助手 <span id="version">v0.4.4</span></h3>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="files">文件列表</div>
    <div class="tab" data-tab="audio">音频采集</div>
    <div class="tab" data-tab="upload">上传辅助</div>
    <div class="tab" data-tab="logs">操作日志</div>
  </div>

  <div id="tab-files" class="tab-content active">
    <!-- Existing files tab content -->
    <div class="filter-bar">
      <div class="filter-group">
        <select id="select-institution">
          <option value="">全部机构</option>
        </select>
        <select id="select-sort">
          <option value="time_desc" selected>时间 ⬇</option>
          <option value="count_desc">下载量 ⬇</option>
          <option value="time_asc">时间 ⬆</option>
        </select>
      </div>
    </div>

    <div class="settings-bar file-download-rules">
      <label class="setting-item">下载前 <input type="number" id="download-limit" value="5" min="1"> 个</label>
      <label class="setting-item">下载量 &gt; <input type="number" id="min-count" value="30" min="0"></label>
      <label class="setting-item time-bound">上传从 <input type="datetime-local" id="upload-start-time" title="只下载此时间之后上传的文件"></label>
      <label class="setting-item time-bound">到 <input type="datetime-local" id="upload-end-time" title="只下载此时间之前上传的文件"></label>
    </div>
    
    <div class="control-bar">
      <button id="btn-scan" class="primary-btn">刷新当前页</button>
      <button id="btn-import-file-response" class="primary-btn" style="background:#00897b;" title="导入复制的文件搜索接口响应">导入响应</button>
      <button id="btn-deep-scan" class="primary-btn" style="background:#673ab7;">获取下载量</button>
      <button id="btn-stop-deep" class="danger-btn" style="display:none;">停止获取</button>
      <button id="btn-start-batch" class="primary-btn">开始批量</button>
      <button id="btn-stop-batch" class="danger-btn" style="display:none;">停止下载</button>
      <button id="btn-retry-failed" class="primary-btn" style="background:#ff9800;">重下失败</button>
      <button id="btn-sync-file-history" class="primary-btn" style="background:#00897b;">同步历史</button>
      <button id="btn-export-list" class="primary-btn" style="background:#4caf50;">导出列表</button>
      <button id="btn-clear-files" class="danger-btn">清空列表</button>
    </div>
    <div id="file-import-panel" class="file-import-panel" hidden>
      <textarea id="file-import-response" aria-label="PDF 接口响应 JSON" placeholder="粘贴接口响应 JSON"></textarea>
      <div class="file-import-actions">
        <button id="btn-confirm-file-import" class="primary-btn">导入并刷新</button>
        <button id="btn-cancel-file-import">取消</button>
      </div>
    </div>
    <div id="file-batch-progress" class="batch-progress" hidden aria-live="polite">
      <span id="file-batch-progress-text" class="batch-progress-text"></span>
      <progress id="file-batch-progress-bar" max="1" value="0"></progress>
      <span id="file-batch-progress-name" class="batch-progress-name"></span>
    </div>

    <div class="stats">
      <span>当前显示: <b id="count-found">0</b></span>
      <span>今日文件: <b id="count-today">0</b></span>
      <span>累计完成: <b id="count-done">0</b></span>
    </div>
    
    <!-- 列表表头 -->
    <div class="list-header">
      <span class="col-name">文件名</span>
      <span class="col-time">上传时间</span>
      <span class="col-count">量</span>
      <span class="col-status">操作</span>
    </div>
    <ul id="file-list" class="list">
      <li class="empty-hint">点击“刷新当前页”扫描内容</li>
    </ul>
  </div>

  <div id="tab-audio" class="tab-content">
    <div class="audio-panel">
      <div class="settings-bar audio-download-rules">
        <label class="setting-item">下载前 <input type="number" id="audio-download-limit" value="5" min="1"> 个</label>
        <label class="setting-item">下载量 ≥ <input type="number" id="audio-min-count" value="10" min="0"></label>
        <label class="setting-item until-field">截止到 <input type="text" id="audio-download-until" placeholder="文件名..."></label>
        <select id="audio-sort" title="音频排序">
          <option value="time_desc" selected>时间 ↓</option>
          <option value="count_desc">下载量 ↓</option>
        </select>
      </div>
      <div class="settings-bar audio-time-rules">
        <label class="setting-item">上传从 <input type="datetime-local" id="audio-upload-start-time"></label>
        <label class="setting-item">上传到 <input type="datetime-local" id="audio-upload-end-time"></label>
      </div>
      <div class="control-bar audio-control-bar">
        <button id="btn-go-audio" class="primary-btn audio-btn teal-btn">进入搜索页</button>
        <button id="btn-scan-audio" class="primary-btn audio-btn">扫描列表</button>
        <button id="btn-import-audio-response" class="primary-btn audio-btn teal-btn" title="导入复制的音频搜索接口响应">导入响应</button>
        <button id="btn-deep-scan-audio" class="primary-btn audio-btn purple-btn">获取下载量</button>
        <button id="btn-stop-deep-audio" class="danger-btn audio-btn" style="display:none;">停止获取</button>
        <button id="btn-batch-audio" class="primary-btn audio-btn red-btn">开始下载</button>
        <button id="btn-stop-audio" class="danger-btn audio-btn" style="display:none;">停止</button>
        <button id="btn-retry-failed-audio" class="primary-btn audio-btn" style="background:#ff9800;">重下失败</button>
        <button id="btn-sync-audio-history" class="primary-btn audio-btn teal-btn">同步历史</button>
        <button id="btn-export-audio" class="primary-btn audio-btn blue-btn">导出 CSV</button>
        <button id="btn-clear-audio" class="danger-btn audio-btn">清空</button>
        <button id="btn-clear-audio-history" class="danger-btn audio-btn">清除记录</button>
      </div>
      <div id="audio-import-panel" class="audio-import-panel" hidden>
        <textarea id="audio-import-response" aria-label="音频接口响应 JSON" placeholder="粘贴接口响应 JSON"></textarea>
        <div class="audio-import-actions">
          <button id="btn-confirm-audio-import" class="primary-btn">导入并刷新</button>
          <button id="btn-cancel-audio-import">取消</button>
        </div>
      </div>
      <div id="audio-batch-progress" class="batch-progress" hidden aria-live="polite">
        <span id="audio-batch-progress-text" class="batch-progress-text"></span>
        <progress id="audio-batch-progress-bar" max="1" value="0"></progress>
        <span id="audio-batch-progress-name" class="batch-progress-name"></span>
      </div>
    </div>
    <div class="stats">
      <span>已发现音频: <b id="audio-found-count">0</b></span>
    </div>
  <div class="list-header audio-item">
    <span class="col-name">音频标题</span>
    <span class="col-time">上传时间</span>
    <span class="col-count">量</span>
    <span class="col-status">操作</span>
  </div>    <ul id="audio-list" class="list">
      <li class="empty-hint">进入音频搜索页后点击“扫描”</li>
    </ul>
  </div>

  <div id="tab-upload" class="tab-content">
    <div class="upload-panel">
      <div class="control-group">
        <label>流程控制:</label>
        <button id="btn-open-post" class="primary-btn">1. 进入发布模式</button>
        <button id="btn-trigger-upload" class="primary-btn">2. 呼出文件选择</button>
      </div>
      <div class="control-group">
        <label>智能设置:</label>
        <div class="setting-row">
          <input type="checkbox" id="check-auto-title" checked>
          <span>将文件名自动填入标题</span>
        </div>
      </div>
      <div class="control-group remote-history-config">
        <div class="group-header">
          <label>远端下载历史</label>
          <button id="btn-save-remote-history-config" class="primary-btn">保存配置</button>
        </div>
        <div class="remote-history-grid">
          <label class="setting-item remote-endpoint">接口 <input type="url" id="remote-history-endpoint" autocomplete="off"></label>
          <label class="setting-item remote-app-id">App ID <input type="text" id="remote-history-app-id" autocomplete="off"></label>
          <label class="setting-item remote-secret">Secret <input type="password" id="remote-history-secret" autocomplete="new-password"></label>
          <label class="setting-item">星球 ID <input type="text" id="remote-history-group-id" inputmode="numeric"></label>
          <label class="setting-item">PDF Tab ID <input type="text" id="remote-history-pdf-tab-id" inputmode="numeric"></label>
          <label class="setting-item">MP3 Tab ID <input type="text" id="remote-history-mp3-tab-id" inputmode="numeric"></label>
          <label class="setting-item remote-days">天数 <input type="number" id="remote-history-days" min="1" max="30"></label>
        </div>
      </div>
    </div>
  </div>

  <div id="tab-logs" class="tab-content">
    <div class="log-actions">
      <button id="btn-export-logs" class="primary-btn">导出日志</button>
      <button id="btn-clear-logs" class="danger-btn">清空日志</button>
    </div>
    <div id="log-viewer" class="log-container"></div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
